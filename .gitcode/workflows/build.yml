# GitCode 流水线：Linux 编译二进制并上传产物
# 文档：https://docs.gitcode.com/docs/help/home/org_project/pipeline/quick-start/
# 注意：GitCode 托管 runner 目前仅提供 Linux；
#   - 若 `ubuntu-latest` 标签不可用，改为官方示例的 `euleros-2.10.1`，
#     并将系统依赖安装命令换成 dnf 等价命令；
#   - 第三方 action（actions/checkout 等）来自 GitCode 插件市场，
#     若解析失败可到 https://gitcode.com 的 action 市场搜索替代。
# Windows/macOS 安装包请使用仓库内的 .github/workflows/build.yml（GitHub Actions）。
name: Build Linux

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装系统依赖（WebKitGTK 等）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装 Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # 缓存编译产物；若 GitCode 市场暂无 actions/cache 可删除此步
      - name: 缓存 Rust 产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-linux-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: 安装前端依赖（国内镜像）
        run: npm install --registry=https://registry.npmmirror.com

      - name: 后端单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 构建 Linux 安装包（deb / AppImage）
        run: npx tauri build

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: compare-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30
