name: Build

on:
  # 仅推送 v* tag 时构建并发布 Release（如 v1.0.0）
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 保留手动触发便于调试

jobs:
  build:
    permissions:
      contents: write # 用于创建 release（仅打 tag 时）
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tauri CLI 一次只接受一个 --target，macOS 两个架构拆成两个 runner
          - platform: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
          - platform: macos-latest # Intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ''
          - platform: windows-latest
            target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖（Ubuntu）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装前端依赖
        run: npm install

      - name: 后端单元测试
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 构建应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # 仅打 tag 时创建 release
          releaseName: 'Compare v__VERSION__'
          releaseBody: '自动构建产物'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - name: 上传构建产物（Workflow Artifacts）
        uses: actions/upload-artifact@v4
        with:
          # macOS 两个架构按 target 命名，Linux/Windows 用平台名，避免同名冲突
          name: compare-bundle-${{ matrix.target || matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*.exe
