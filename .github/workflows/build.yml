name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write # 用于创建 release（仅打 tag 时）
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # arm64 + x86_64
            args: --target aarch64-apple-darwin --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖（Ubuntu）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装前端依赖
        run: npm install

      - name: 后端单元测试
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 构建应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # 仅打 tag 时创建 release
          releaseName: 'Compare v__VERSION__'
          releaseBody: '自动构建产物'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
